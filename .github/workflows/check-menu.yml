name: Bethesda Menu Check

on:
  schedule:
    # Mittwoch + Donnerstag 05:30 UTC. Donnerstag ist nur Reserve, falls GitHub den
    # Mittwochslauf verschluckt - gemeldet wird jede Woche nur einmal (notified_dates.json).
    - cron: "30 5 * * 3,4"
  workflow_dispatch:
    inputs:
      modus:
        description: "Was soll passieren? (nur 'check' schreibt an den ganzen Verteiler)"
        type: choice
        default: "trockenlauf - echter Check, Meldung nur an mich"
        options:
          - "trockenlauf - echter Check, Meldung nur an mich"
          - "test-ntfy - Testnachricht nur per ntfy"
          - "test-email - Testnachricht nur an meine Debug-Adresse"
          - "test-beide - Testnachricht ntfy + Debug-Adresse"
          - "test-alle - Testmail an den GANZEN Verteiler (prüfen, ob alle sie bekommen)"
          - "dump-pdf - nur Diagnose im Log, keine Meldung"
          - "check - normaler Lauf, Meldung an den VERTEILER"
      pdf_url:
        description: "Optional für trockenlauf/dump-pdf: statt der Links von der Menüseite diese PDF-URL(s) prüfen (mit Leerzeichen getrennt)"
        type: string
        required: false
        default: ""

permissions:
  contents: write   # nötig, damit der Job notified_dates.json zurück committen darf

concurrency:
  group: menu-check   # nie zwei Läufe gleichzeitig (sonst Konflikt beim Committen)
  cancel-in-progress: false

jobs:
  check-menu:
    runs-on: ubuntu-latest
    env:
      # Geplanter Lauf = immer "check". Manuell = Auswahl oben (nur das erste Wort zählt).
      MODUS: ${{ github.event_name == 'workflow_dispatch' && inputs.modus || 'check' }}
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Die Wochen-PDFs haben keine Textebene, der Text wird per OCR (Tesseract) gelesen.
      - name: Tesseract (OCR) installieren
        if: ${{ !startsWith(env.MODUS, 'test-') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Menü prüfen
        env:
          # Beide Benachrichtigungskanäle sind unabhängig voneinander optional.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Debug-Kanäle für Tests, Trockenläufe und Problem-Meldungen (nie der Verteiler).
          # NTFY_TOPIC_DEBUG leer = NTFY_TOPIC. EMAIL_TO_DEBUG leer = keine Debug-Mail.
          NTFY_TOPIC_DEBUG: ${{ secrets.NTFY_TOPIC_DEBUG }}
          EMAIL_TO_DEBUG: ${{ secrets.EMAIL_TO_DEBUG }}
          # Gesuchte Gerichte, kommagetrennt. Nicht sensibel, kann alternativ
          # auch als Repository Variable (vars.KEYWORDS) gepflegt werden.
          KEYWORDS: ${{ secrets.KEYWORDS }}
          # Anpassbarer E-Mail-Text (Repository Variablen, siehe README). Leer = Standardtext.
          EMAIL_SUBJECT: ${{ vars.EMAIL_SUBJECT }}
          EMAIL_BODY: ${{ vars.EMAIL_BODY }}
          # Optionale Einstellungen (Repository Variablen). Leer = Standardwert.
          TAGE: ${{ vars.TAGE }}             # Einzeltage, die gemeldet werden (Standard: alle Tage)
          PDF_CHECK: ${{ vars.PDF_CHECK }}   # 0 = PDF-Prüfung abschalten
          PDF_OCR: ${{ vars.PDF_OCR }}       # never = OCR abschalten (aktuelle PDFs brauchen OCR!)
          PDF_URLS: ${{ github.event_name == 'workflow_dispatch' && inputs.pdf_url || '' }}
        run: python menu_check.py

      - name: Status-Datei committen (falls geändert)
        if: ${{ startsWith(env.MODUS, 'check') }}
        run: |
          git config user.name "menu-checker-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet notified_dates.json; then
            git add notified_dates.json
            git commit -m "Update notified_dates.json [skip ci]"
            git push
          else
            echo "Keine Änderungen an notified_dates.json"
          fi
